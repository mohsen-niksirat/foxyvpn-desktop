<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Link expired</title>
<style>
  :root { --bg: #0f1218; --card: #171b23; --text: #e8ebf1; --muted: #8b93a3; --warn: #f0a33a; --ring: rgba(240, 163, 58, .28); --button: #3b82f6; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f5f9; --card: #ffffff; --text: #18202c; --muted: #667085; --warn: #d9821a; --ring: rgba(217, 130, 26, .2); --button: #2563eb; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, var(--ring), transparent 60%), var(--bg);
    color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: min(440px, 100%); padding: 40px 32px; text-align: center; border-radius: 20px;
    background: var(--card); box-shadow: 0 20px 50px rgba(0, 0, 0, .18);
  }
  svg { width: 52px; height: 52px; margin-bottom: 18px; color: var(--warn); }
  h1 { margin: 0 0 10px; font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
  p { margin: 0 0 26px; color: var(--muted); }
  a {
    display: inline-block; padding: 11px 22px; border-radius: 12px; background: var(--button);
    color: #fff; text-decoration: none; font-weight: 600;
  }
  a:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
    </svg>
    <h1>This link has expired</h1>
    <p>Each sign-in link works once, for 15 minutes. Open the panel again from the app for a new link, or sign in with the username and password.</p>
    <a href="/app/">Go to sign-in</a>
  </main>
</body>
</html>
